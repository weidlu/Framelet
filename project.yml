name: Framelet
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: "5"
    MARKETING_VERSION: "0.3.1"
targets:
  FrameletCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/FrameletCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framelet.capture.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  Framelet:
    type: application
    platform: macOS
    sources:
      - path: Sources/Framelet
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: FrameletCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framelet.capture
        INFOPLIST_FILE: Resources/AppStore-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/FrameletAppStore.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FRAMELET_APP_STORE
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
schemes:
  Framelet:
    build:
      targets:
        Framelet: all
    run:
      config: Debug
    archive:
      config: Release
